<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>É sério!!!</title>
    <style type="text/css">
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
        }
        #titulo {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #222222;
        }
        #mensagem {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #777777;
        }
        #botao {
            position: absolute;
            width: 330px;
            height: 70px;
            left: 50%;
            top: 50%;
            margin-left: -165px;
            margin-top: -35px;
            border: 3px solid #111111;
            border-radius: 8px;
            background: #ffdd00;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 4px 4px 0 #111111;
        }
        #contador {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div id="titulo">IKAELLY, CLICA ALI, SÉRIO</div>
    <div id="mensagem">É só clicar no botão. Fácil.</div>
    <button id="botao" type="button">CLIQUE AQUI PRA VER UMA COISA!!! (É SÉRIO)</button>
   
    <script type="text/javascript">
        (function () {
            var botao = document.getElementById("botao");
            var contador = document.getElementById("contador");
            var tentativas = 0;
            function larguraJanela() {
                return window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            }
            function alturaJanela() {
                return window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            }
            function numeroAleatorio(minimo, maximo) {
                return Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;
            }
            function fugir() {
                var larguraTela = larguraJanela();
                var alturaTela = alturaJanela();
                var larguraBotao = botao.offsetWidth;
                var alturaBotao = botao.offsetHeight;
                var margem = 15;
                var maxX = larguraTela - larguraBotao - margem;
                var maxY = alturaTela - alturaBotao - margem;
                if (maxX < margem) { maxX = margem; }
                if (maxY < 120) { maxY = 120; }
                var novoX = numeroAleatorio(margem, maxX);
                var novoY = numeroAleatorio(120, maxY);
                botao.style.left = novoX + "px";
                botao.style.top = novoY + "px";
                botao.style.marginLeft = "0";
                botao.style.marginTop = "0";
                tentativas++;
                contador.innerHTML = "Tentativas: " + tentativas;
                if (tentativas === 5) {
                    document.getElementById("mensagem").innerHTML = "Tá difícil? Talvez na próxima...";
                } else if (tentativas === 10) {
                    document.getElementById("mensagem").innerHTML = "Você ainda está tentando? 😂";
                } else if (tentativas === 20) {
                    document.getElementById("mensagem").innerHTML = "Eu admiro a persistência.";
                } else if (tentativas === 40) {
                    document.getElementById("mensagem").innerHTML = "Agora virou uma questão pessoal.";
                }
            }
            botao.onmouseover = fugir;
            botao.onclick = function (evento) {
                if (evento && evento.preventDefault) { evento.preventDefault(); }
                fugir();
                return false;
            };
            botao.onfocus = function () { fugir(); };
            botao.ontouchstart = function (evento) {
                if (evento && evento.preventDefault) { evento.preventDefault(); }
                fugir();
                return false;
            };
        })();
    </script>
</body>
</html>
